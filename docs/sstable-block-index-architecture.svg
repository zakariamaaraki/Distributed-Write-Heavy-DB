<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">Bounded multi-file SSTable layout with sparse-index candidate reads</title>
  <desc id="desc">A sorted flush run is partitioned into bounded SSTable data files. Every data file has Bloom filter and sparse index sidecars. Point reads scan sparse indexes, select candidate files, then use Bloom filters and block offsets to read only relevant data blocks.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      .page{fill:#f8fafc}.header{fill:#0f172a}.band{fill:#fff;stroke:#cbd5e1;stroke-width:2}.run{fill:#eef2ff;stroke:#6366f1;stroke-width:2.5}.data{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5}.bloom{fill:#ecfdf5;stroke:#16a34a;stroke-width:2.5}.index{fill:#fff7ed;stroke:#d97706;stroke-width:2.5}.hit{fill:#fffbeb;stroke:#d97706;stroke-width:3}.muted{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}.chip{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.title{font:700 36px Arial,sans-serif;fill:#fff}.subtitle{font:500 16px Arial,sans-serif;fill:#334155}.band-title{font:700 24px Arial,sans-serif;fill:#0f172a}.heading{font:700 20px Arial,sans-serif;fill:#0f172a}.label{font:600 16px Arial,sans-serif;fill:#1f2937}.small{font:500 14px Arial,sans-serif;fill:#475569}.tiny{font:500 12px Arial,sans-serif;fill:#64748b}.mono{font:600 13px Consolas,monospace;fill:#1f2937}.mono-small{font:600 12px Consolas,monospace;fill:#1f2937}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.blue{stroke:#2563eb}.green{stroke:#16a34a}.amber{stroke:#d97706}.gray{stroke:#64748b}.dash{stroke-dasharray:8 8}
    </style>
  </defs>

  <rect class="page" width="1800" height="1260"/>
  <rect class="header" width="1800" height="92"/>
  <text class="title" x="900" y="57" text-anchor="middle">Bounded SSTable Files, Bloom Filters, and Sparse Indexes</text>
  <text class="subtitle" x="900" y="125" text-anchor="middle">A flush or compaction creates one sorted run, partitioned into manageable immutable files with per-file sidecars.</text>

  <rect class="band" x="60" y="155" width="1680" height="320" rx="18"/>
  <text class="band-title" x="100" y="195">One Sorted Run → Multiple Physical SSTable Files</text>
  <rect class="run" x="100" y="230" width="270" height="175" rx="14"/>
  <text class="heading" x="235" y="265" text-anchor="middle">Sorted run</text>
  <text class="small" x="235" y="292" text-anchor="middle">records ordered by key</text>
  <text class="mono-small" x="130" y="330">customer:1000 ... 1006</text>
  <text class="mono-small" x="130" y="355">partition at max file size</text>
  <text class="tiny" x="235" y="385" text-anchor="middle">one oversized block is never split</text>

  <path class="line blue" d="M370 318L450 318" marker-end="url(#arrow-blue)"/>
  <text class="tiny" x="410" y="300" text-anchor="middle">partition</text>

  <g transform="translate(470,215)">
    <rect class="data" width="350" height="72" rx="12"/><text class="heading" x="175" y="29" text-anchor="middle">sstable-001.json</text><text class="mono-small" x="175" y="54" text-anchor="middle">keys 1000–1002</text>
    <rect class="bloom" y="84" width="168" height="48" rx="9"/><text class="small" x="84" y="113" text-anchor="middle">.bloom.json</text>
    <rect class="index" x="182" y="84" width="168" height="48" rx="9"/><text class="small" x="266" y="113" text-anchor="middle">.index.json</text>
  </g>
  <g transform="translate(890,215)">
    <rect class="data" width="350" height="72" rx="12"/><text class="heading" x="175" y="29" text-anchor="middle">sstable-002.json</text><text class="mono-small" x="175" y="54" text-anchor="middle">keys 1003–1005</text>
    <rect class="bloom" y="84" width="168" height="48" rx="9"/><text class="small" x="84" y="113" text-anchor="middle">.bloom.json</text>
    <rect class="index" x="182" y="84" width="168" height="48" rx="9"/><text class="small" x="266" y="113" text-anchor="middle">.index.json</text>
  </g>
  <g transform="translate(1310,215)">
    <rect class="data" width="350" height="72" rx="12"/><text class="heading" x="175" y="29" text-anchor="middle">sstable-003.json</text><text class="mono-small" x="175" y="54" text-anchor="middle">keys 1006–...</text>
    <rect class="bloom" y="84" width="168" height="48" rx="9"/><text class="small" x="84" y="113" text-anchor="middle">.bloom.json</text>
    <rect class="index" x="182" y="84" width="168" height="48" rx="9"/><text class="small" x="266" y="113" text-anchor="middle">.index.json</text>
  </g>
  <text class="tiny" x="1065" y="430" text-anchor="middle">Every physical data file has matching Bloom and sparse-index sidecars; the default maximum is 64 MiB.</text>

  <rect class="band" x="60" y="505" width="1680" height="205" rx="18"/>
  <text class="band-title" x="100" y="545">Point Read: customer:1004</text>
  <rect class="muted" x="100" y="575" width="220" height="80" rx="12"/><text class="label" x="210" y="607" text-anchor="middle">1. Memtable miss</text><text class="small" x="210" y="632" text-anchor="middle">consult SSTable indexes</text>
  <rect class="index" x="380" y="565" width="315" height="100" rx="12"/><text class="label" x="537" y="596" text-anchor="middle">2. Scan sparse indexes</text><text class="small" x="537" y="621" text-anchor="middle">all file ranges are checked</text><text class="mono-small" x="537" y="646" text-anchor="middle">1003 &lt;= 1004 &lt;= 1005</text>
  <rect class="hit" x="755" y="565" width="295" height="100" rx="12"/><text class="label" x="902" y="596" text-anchor="middle">3. Select candidates</text><text class="small" x="902" y="621" text-anchor="middle">sstable-002 only</text><text class="small" x="902" y="646" text-anchor="middle">other data files stay closed</text>
  <rect class="bloom" x="1110" y="565" width="260" height="100" rx="12"/><text class="label" x="1240" y="596" text-anchor="middle">4. Bloom check</text><text class="small" x="1240" y="621" text-anchor="middle">definite miss → skip</text><text class="small" x="1240" y="646" text-anchor="middle">possible hit → seek index block</text>
  <rect class="data" x="1430" y="565" width="245" height="100" rx="12"/><text class="label" x="1552" y="596" text-anchor="middle">5. Seek + read</text><text class="mono-small" x="1552" y="621" text-anchor="middle">offset, length</text><text class="small" x="1552" y="646" text-anchor="middle">highest sequence wins</text>
  <path class="line gray" d="M320 615L380 615" marker-end="url(#arrow-gray)"/><path class="line amber" d="M695 615L755 615" marker-end="url(#arrow-amber)"/><path class="line green" d="M1050 615L1110 615" marker-end="url(#arrow-green)"/><path class="line blue" d="M1370 615L1430 615" marker-end="url(#arrow-blue)"/>

  <rect class="band" x="60" y="740" width="1680" height="445" rx="18"/>
  <text class="band-title" x="100" y="780">Inside the Selected File: sstable-002.json</text>
  <rect class="data" x="100" y="815" width="610" height="300" rx="14"/>
  <text class="heading" x="405" y="850" text-anchor="middle">Data file: block byte stream</text>
  <rect class="chip" x="135" y="880" width="540" height="62" rx="8"/><text class="mono-small" x="155" y="908">offset 0: [customer:1003, customer:1004]</text><text class="tiny" x="155" y="929">JSON block + SHA-256 checksum</text>
  <rect class="hit" x="135" y="962" width="540" height="62" rx="8"/><text class="mono-small" x="155" y="990">offset 320: [customer:1004] ← selected block</text><text class="tiny" x="155" y="1011">read only this byte range</text>
  <rect class="chip" x="135" y="1044" width="540" height="42" rx="8"/><text class="small" x="405" y="1071" text-anchor="middle">No outer JSON array; blocks are independently indexed.</text>

  <rect class="index" x="780" y="815" width="470" height="300" rx="14"/>
  <text class="heading" x="1015" y="850" text-anchor="middle">.index.json</text>
  <text class="small" x="1015" y="875" text-anchor="middle">one entry per block</text>
  <rect class="chip" x="815" y="900" width="400" height="72" rx="8"/><text class="mono-small" x="835" y="927">{ firstKey: "customer:1003",</text><text class="mono-small" x="835" y="949">  lastKey: "customer:1003", offset: 0 }</text>
  <rect class="hit" x="815" y="990" width="400" height="82" rx="8"/><text class="mono-small" x="835" y="1017">{ firstKey: "customer:1004",</text><text class="mono-small" x="835" y="1039">  lastKey: "customer:1004", offset: 320,</text><text class="mono-small" x="835" y="1061">  length: 280, checksum: "..." }</text>

  <rect class="bloom" x="1320" y="815" width="350" height="300" rx="14"/>
  <text class="heading" x="1495" y="850" text-anchor="middle">.bloom.json</text>
  <text class="small" x="1495" y="878" text-anchor="middle">keys for this file only</text>
  <rect class="chip" x="1350" y="920" width="290" height="70" rx="8"/><text class="mono-small" x="1495" y="950" text-anchor="middle">hash(customer:1004)</text><text class="small" x="1495" y="973" text-anchor="middle">all bits set → possible hit</text>
  <text class="small" x="1495" y="1035" text-anchor="middle">Bloom filters select files;</text><text class="small" x="1495" y="1060" text-anchor="middle">sparse indexes select blocks.</text>

  <path class="line amber" d="M710 965L780 965" marker-end="url(#arrow-amber)"/><path class="line green" d="M1250 965L1320 965" marker-end="url(#arrow-green)"/>
  <text class="small" x="900" y="1150" text-anchor="middle">Compaction writes all new bounded files before deleting the old run, preserving recovery on failure.</text>
</svg>