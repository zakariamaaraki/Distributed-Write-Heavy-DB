<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <style>text{font-family:Arial,sans-serif;fill:#172033} .box{fill:#eef4ff;stroke:#356ae6;stroke-width:2} .p{fill:#effaf3;stroke:#2f9e63;stroke-width:2} .fail{fill:#fff1f0;stroke:#d64545;stroke-width:2} .arrow{stroke:#40526d;stroke-width:2;marker-end:url(#a)} .label{font-size:18px;font-weight:bold} .small{font-size:15px}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#40526d"/></marker></defs>
  <text x="30" y="35" class="label">Distributed transaction: coordinator-driven two-phase commit</text>
  <rect x="40" y="190" width="180" height="90" rx="12" class="box"/><text x="75" y="225" class="label">Client / Router</text><text x="67" y="250" class="small">begin, stage, commit</text>
  <rect x="330" y="160" width="220" height="150" rx="12" class="box"/><text x="375" y="205" class="label">Coordinator</text><text x="370" y="235" class="small">discover leaders</text><text x="370" y="260" class="small">prepare all</text><text x="370" y="285" class="small">commit all</text>
  <rect x="700" y="80" width="250" height="90" rx="12" class="p"/><text x="750" y="115" class="label">Users leader</text><text x="735" y="142" class="small">prepare → commit → WAL</text>
  <rect x="700" y="220" width="250" height="90" rx="12" class="p"/><text x="750" y="255" class="label">Orders leader</text><text x="735" y="282" class="small">prepare → commit → WAL</text>
  <rect x="700" y="360" width="250" height="90" rx="12" class="fail"/><text x="750" y="395" class="label">Failure window</text><text x="730" y="422" class="small">in-doubt until decision recovery</text>
  <path d="M220 235 L330 235" class="arrow"/><path d="M550 210 L700 125" class="arrow"/><path d="M550 260 L700 265" class="arrow"/><path d="M550 300 L700 400" class="arrow"/>
  <text x="570" y="145" class="small">prepare / commit</text><text x="570" y="245" class="small">prepare / commit</text><text x="565" y="365" class="small">timeout / in-doubt</text>
</svg>
