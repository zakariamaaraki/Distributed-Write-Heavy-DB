<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">SQL console screenshot</title><desc id="desc">A browser-style SQL console showing a relational table query and result rows.</desc>
  <rect width="1500" height="820" fill="#e2e8f0"/><rect x="45" y="35" width="1410" height="750" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="45" y="35" width="1410" height="58" rx="14" fill="#1e293b"/><circle cx="78" cy="64" r="8" fill="#fb7185"/><circle cx="105" cy="64" r="8" fill="#fbbf24"/><circle cx="132" cy="64" r="8" fill="#34d399"/><text x="750" y="72" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="22" font-weight="600">LsmWriteDb SQL Console</text>
  <text x="82" y="140" fill="#475569" font-family="Arial" font-size="20" font-weight="600">Query</text><rect x="82" y="160" width="1335" height="145" rx="8" fill="#0f172a"/>
  <text x="108" y="202" fill="#67e8f9" font-family="Consolas" font-size="21">SELECT key, value</text><text x="350" y="202" fill="#f8fafc" font-family="Consolas" font-size="21">FROM users WHERE key = '42';</text><rect x="82" y="326" width="130" height="44" rx="7" fill="#2563eb"/><text x="147" y="355" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18" font-weight="600">Execute</text>
  <text x="82" y="430" fill="#475569" font-family="Arial" font-size="20" font-weight="600">Result · SELECT · 1 row</text><rect x="82" y="450" width="1335" height="90" fill="#dbeafe"/><text x="110" y="505" fill="#1e3a8a" font-family="Arial" font-size="18" font-weight="700">key</text><text x="260" y="505" fill="#1e3a8a" font-family="Arial" font-size="18" font-weight="700">value</text><rect x="82" y="540" width="1335" height="82" fill="#f8fafc" stroke="#cbd5e1"/><text x="110" y="590" fill="#334155" font-family="Consolas" font-size="18">42</text><text x="260" y="590" fill="#334155" font-family="Consolas" font-size="18">{"name":"Ada","active":true}</text>
  <text x="82" y="700" fill="#64748b" font-family="Arial" font-size="18">Schema validation: relational table · primary key: id · JSON columns: name, active</text>
</svg>