<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">ANSI SQL relational table CRUD example</title>
  <desc id="desc">A terminal-style console showing standard SQL CREATE, INSERT, SELECT, UPDATE, and DELETE statements over a relational table.</desc>
  <rect width="1500" height="980" fill="#101827"/>
  <rect x="38" y="32" width="1424" height="916" rx="18" fill="#172235" stroke="#334155" stroke-width="2"/>
  <rect x="38" y="32" width="1424" height="58" rx="18" fill="#243247"/>
  <circle cx="76" cy="61" r="8" fill="#fb7185"/><circle cx="103" cy="61" r="8" fill="#fbbf24"/><circle cx="130" cy="61" r="8" fill="#34d399"/>
  <text x="750" y="68" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="22" font-weight="600">LsmWriteDb - ANSI SQL relational CRUD</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="21">
    <text x="78" y="135" fill="#67e8f9">sql&gt;</text><text x="150" y="135" fill="#f8fafc">CREATE TABLE users (id INTEGER PRIMARY KEY, name VARCHAR(255) NOT NULL, active BOOLEAN);</text>
    <text x="78" y="169" fill="#86efac">ok</text><text x="150" y="169" fill="#cbd5e1">CREATE TABLE - table created</text>
    <text x="78" y="215" fill="#67e8f9">sql&gt;</text><text x="150" y="215" fill="#f8fafc">INSERT INTO users (id, name, active) VALUES (42, 'Ada', TRUE);</text>
    <text x="78" y="249" fill="#86efac">ok</text><text x="150" y="249" fill="#cbd5e1">INSERT - 1 row affected</text>
    <text x="78" y="295" fill="#67e8f9">sql&gt;</text><text x="150" y="295" fill="#f8fafc">SELECT id, name, active FROM users WHERE id = 42;</text>
    <text x="78" y="329" fill="#86efac">ok</text><text x="150" y="329" fill="#cbd5e1">SELECT - 1 row returned</text>
    <text x="78" y="375" fill="#67e8f9">sql&gt;</text><text x="150" y="375" fill="#f8fafc">UPDATE users SET name = 'Grace' WHERE id = 42;</text>
    <text x="78" y="409" fill="#86efac">ok</text><text x="150" y="409" fill="#cbd5e1">UPDATE - 1 row affected</text>
    <text x="78" y="455" fill="#67e8f9">sql&gt;</text><text x="150" y="455" fill="#f8fafc">DELETE FROM users WHERE id = 42;</text>
    <text x="78" y="489" fill="#86efac">ok</text><text x="150" y="489" fill="#cbd5e1">DELETE - 1 row affected</text>
    <text x="78" y="555" fill="#fbbf24">SELECT response</text>
    <text x="78" y="595" fill="#fbbf24">{</text>
    <text x="112" y="629" fill="#cbd5e1">"statementType": </text><text x="335" y="629" fill="#86efac">"SELECT"</text><text x="445" y="629" fill="#cbd5e1">,</text>
    <text x="112" y="663" fill="#cbd5e1">"rowsAffected": </text><text x="340" y="663" fill="#93c5fd">1</text><text x="355" y="663" fill="#cbd5e1">,</text>
    <text x="112" y="697" fill="#cbd5e1">"rows": [</text>
    <text x="146" y="731" fill="#cbd5e1">{ "id": </text><text x="260" y="731" fill="#93c5fd">42</text><text x="295" y="731" fill="#cbd5e1">, "name": </text><text x="430" y="731" fill="#86efac">"Ada"</text><text x="510" y="731" fill="#cbd5e1">, "active": </text><text x="650" y="731" fill="#fbbf24">true</text><text x="705" y="731" fill="#cbd5e1"> }</text>
    <text x="112" y="765" fill="#cbd5e1">]</text><text x="78" y="799" fill="#fbbf24">}</text>
    <text x="78" y="865" fill="#64748b">SQL columns are mapped to JSON properties internally; the storage engine remains unchanged.</text>
  </g>
</svg>