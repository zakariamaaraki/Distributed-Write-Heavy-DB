<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#38526e"/></marker><style>.title{font:700 28px Arial;fill:#172b4d}.h{font:700 18px Arial;fill:#172b4d}.t{font:15px Arial;fill:#243b53}.s{font:13px Consolas;fill:#243b53}.b{stroke:#38526e;stroke-width:2;rx:12}.ar{stroke:#38526e;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1500" height="900" fill="#f7fafc"/><text x="750" y="48" text-anchor="middle" class="title">FASTWRITE exact-value index: write path, storage, and lookup</text>
<rect x="45" y="95" width="310" height="190" class="b" fill="#e8f1fb"/><text x="200" y="130" text-anchor="middle" class="h">1. Source table write</text><text x="70" y="170" class="t">PUT users / user:1</text><text x="70" y="200" class="s">{"tier":"gold", ...}</text><text x="70" y="240" class="t">Extract old and new JSON values</text>
<rect x="410" y="95" width="310" height="190" class="b" fill="#fff4d6"/><text x="565" y="130" text-anchor="middle" class="h">2. Index mutation</text><text x="435" y="170" class="t">old value → tombstone</text><text x="435" y="200" class="t">new value → put</text><text x="435" y="240" class="s">Base64(value) ␟ Base64(rowKey)</text><text x="435" y="265" class="s">value: empty</text>
<rect x="775" y="95" width="310" height="190" class="b" fill="#e8f5e9"/><text x="930" y="130" text-anchor="middle" class="h">3. Normal LSM path</text><text x="800" y="170" class="t">WAL → memtable</text><text x="800" y="200" class="t">flush → bounded SSTables</text><text x="800" y="230" class="t">Bloom + sparse indexes</text><text x="800" y="260" class="t">compaction resolves tombstones</text>
<rect x="1140" y="95" width="315" height="190" class="b" fill="#f0e8fb"/><text x="1297" y="130" text-anchor="middle" class="h">4. Internal table</text><text x="1165" y="170" class="s">__sstable_index_users_tier_fast</text><text x="1165" y="205" class="t">hidden; durable; recoverable</text><text x="1165" y="245" class="t">source table remains authority</text>
<path d="M355 190H405M720 190H770M1085 190H1135" class="ar"/>
<rect x="45" y="365" width="310" height="190" class="b" fill="#e8f1fb"/><text x="200" y="400" text-anchor="middle" class="h">5. Equality query</text><text x="70" y="440" class="t">WHERE value.tier = 'gold'</text><text x="70" y="480" class="t">SQL planner or direct API</text><text x="70" y="520" class="t">exact-value lookup</text>
<rect x="410" y="365" width="310" height="190" class="b" fill="#fff4d6"/><text x="565" y="400" text-anchor="middle" class="h">6. Prefix seek</text><text x="435" y="440" class="s">prefix = Base64("gold") ␟</text><text x="435" y="480" class="t">range-read matching keys</text><text x="435" y="520" class="t">collect row keys</text>
<rect x="775" y="365" width="310" height="190" class="b" fill="#e8f5e9"/><text x="930" y="400" text-anchor="middle" class="h">7. Candidate validation</text><text x="800" y="440" class="t">read source rows by key</text><text x="800" y="480" class="t">recheck JSON path/value</text><text x="800" y="520" class="t">discard stale candidates</text>
<rect x="1140" y="365" width="315" height="190" class="b" fill="#f0e8fb"/><text x="1297" y="400" text-anchor="middle" class="h">8. Result</text><text x="1165" y="440" class="t">return matching row keys</text><text x="1165" y="480" class="t">fetch/project values</text><text x="1165" y="520" class="t">fast exact lookup</text>
<path d="M355 460H405M720 460H770M1085 460H1135" class="ar"/><path d="M930 290V350" class="ar"/>
<rect x="210" y="665" width="1080" height="145" class="b" fill="#fff"/><text x="750" y="705" text-anchor="middle" class="h">Why FASTWRITE?</text><text x="250" y="742" class="t">Append/flush/compact operations avoid synchronous B+ tree page rewrites.</text><text x="250" y="770" class="t">Tradeoff: exact equality lookup only; ordered range scans remain a B+ tree capability.</text><text x="250" y="798" class="t">With Raft, source writes replicate and each node derives the same local index entries.</text>
</svg>