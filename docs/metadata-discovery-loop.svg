<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <style>
    .title { font: 700 30px Arial; fill: #0f172a; }
    .label { font: 600 20px Arial; fill: #0f172a; }
    .small { font: 17px Arial; fill: #334155; }
    .code { font: 16px Consolas, monospace; fill: #1e293b; }
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
    .blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
    .purple { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; }
    .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="70" y="65" class="title">Cluster metadata discovery and recovery loop</text>
  <rect x="70" y="120" width="300" height="150" rx="16" class="blue"/>
  <text x="220" y="165" text-anchor="middle" class="label">Every node</text>
  <text x="220" y="202" text-anchor="middle" class="small">background discovery loop</text>
  <text x="220" y="235" text-anchor="middle" class="code">approximately every second</text>
  <path d="M370 195 H520" class="arrow"/>
  <rect x="520" y="120" width="330" height="150" rx="16" class="box"/>
  <text x="685" y="165" text-anchor="middle" class="label">GET /tables</text>
  <text x="685" y="202" text-anchor="middle" class="small">from each reachable peer</text>
  <text x="685" y="235" text-anchor="middle" class="code">name + kind</text>
  <path d="M850 195 H1000" class="arrow"/>
  <rect x="1000" y="120" width="410" height="150" rx="16" class="box"/>
  <text x="1205" y="165" text-anchor="middle" class="label">Compare local catalog</text>
  <text x="1205" y="202" text-anchor="middle" class="small">missing or already present?</text>
  <text x="1205" y="235" text-anchor="middle" class="code">idempotent repair</text>
  <path d="M1205 270 V350" class="arrow"/>
  <text x="1205" y="330" text-anchor="middle" class="small">missing object</text>
  <path d="M1080 350 H470" class="arrow"/>
  <rect x="70" y="350" width="400" height="190" rx="16" class="green"/>
  <text x="270" y="395" text-anchor="middle" class="label">kind = table</text>
  <text x="270" y="435" text-anchor="middle" class="small">create local LSM store</text>
  <text x="270" y="468" text-anchor="middle" class="small">initialize table Raft</text>
  <text x="270" y="501" text-anchor="middle" class="small">snapshot + change-log catch-up</text>
  <path d="M1000 445 H850" class="arrow"/>
  <rect x="850" y="350" width="400" height="190" rx="16" class="purple"/>
  <text x="1050" y="395" text-anchor="middle" class="label">kind = view</text>
  <text x="1050" y="435" text-anchor="middle" class="small">GET /views/{view}</text>
  <text x="1050" y="468" text-anchor="middle" class="small">persist query in catalog</text>
  <text x="1050" y="501" text-anchor="middle" class="small">no LSM store or Raft group</text>
  <path d="M270 540 V635 H1205 V540" class="arrow"/>
  <text x="750" y="680" text-anchor="middle" class="small">next discovery pass retries unavailable peers</text>
</svg>