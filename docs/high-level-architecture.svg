<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
 <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.t{font-size:14px}.box{fill:#f7f9fc;stroke:#31527d;stroke-width:2;rx:12}.leader{fill:#e5f4ea;stroke:#2e7d4f}.meta{fill:#fff3d8;stroke:#b7791f}.tier{fill:#eef6ff;stroke:#3b6ea5}.arrow{stroke:#526581;stroke-width:2;fill:none;marker-end:url(#a)}</style>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#526581"/></marker></defs>
 <text x="600" y="40" text-anchor="middle" class="title">Per-Table Leadership and Tiered LSM Architecture</text>
 <rect x="430" y="70" width="340" height="70" class="box meta"/><text x="600" y="98" text-anchor="middle" class="h">__table_ownership</text><text x="600" y="122" text-anchor="middle" class="t">authoritative leader, term, and members</text>
 <rect x="40" y="190" width="320" height="210" class="box leader"/><text x="200" y="225" text-anchor="middle" class="h">Node A</text><text x="70" y="260" class="t">users: Leader</text><text x="70" y="285" class="t">orders: Follower</text><text x="70" y="310" class="t">products: Follower</text><text x="70" y="350" class="t">HTTP / SQL / Raft</text>
 <rect x="440" y="190" width="320" height="210" class="box leader"/><text x="600" y="225" text-anchor="middle" class="h">Node B</text><text x="470" y="260" class="t">users: Follower</text><text x="470" y="285" class="t">orders: Leader</text><text x="470" y="310" class="t">products: Follower</text><text x="470" y="350" class="t">HTTP / SQL / Raft</text>
 <rect x="840" y="190" width="320" height="210" class="box leader"/><text x="1000" y="225" text-anchor="middle" class="h">Node C</text><text x="870" y="260" class="t">users: Follower</text><text x="870" y="285" class="t">orders: Follower</text><text x="870" y="310" class="t">products: Leader</text><text x="870" y="350" class="t">HTTP / SQL / Raft</text>
 <path d="M600 140 V190" class="arrow"/><path d="M430 105 H360 V190" class="arrow"/><path d="M770 105 H840 V190" class="arrow"/>
 <rect x="45" y="455" width="1110" height="315" class="box"/><text x="600" y="490" text-anchor="middle" class="h">One table's durable LSM path on every node</text>
 <rect x="80" y="520" width="200" height="90" class="box tier"/><text x="180" y="550" text-anchor="middle" class="h">Tier 0</text><text x="95" y="577" class="t">Run A: SSTable 01 + 02</text><text x="95" y="598" class="t">Run B: SSTable 03 + 04</text>
 <rect x="350" y="520" width="200" height="90" class="box tier"/><text x="450" y="550" text-anchor="middle" class="h">Tier 1</text><text x="365" y="577" class="t">Run C: SSTable 05 + 06</text><text x="365" y="598" class="t">older promoted runs</text>
 <rect x="620" y="520" width="200" height="90" class="box tier"/><text x="720" y="550" text-anchor="middle" class="h">Tier 2</text><text x="635" y="577" class="t">Run D: SSTable 07 + 08</text><text x="635" y="598" class="t">older promoted runs</text>
 <rect x="890" y="520" width="220" height="90" class="box"/><text x="1000" y="550" text-anchor="middle" class="h">Read merge</text><text x="905" y="577" class="t">highest sequence wins</text><text x="905" y="598" class="t">tombstones suppress old data</text>
 <path d="M280 565 H350" class="arrow"/><path d="M550 565 H620" class="arrow"/><path d="M820 565 H890" class="arrow"/>
 <text x="90" y="655" class="t">WAL → ordered memtable → flush creates one logical Tier-0 run</text><text x="90" y="680" class="t">Four logical runs → compaction merge → one promoted run, possibly split into many bounded SSTables</text><text x="90" y="705" class="t">Every physical SSTable has blocks + sparse index + Bloom filter; run IDs group split files</text><text x="90" y="730" class="t">Committed change log → SSE replication → followers apply the same table sequence</text>
</svg>