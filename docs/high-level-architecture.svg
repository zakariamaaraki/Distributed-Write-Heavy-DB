<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">High-level architecture of the distributed LSM write-heavy database</title>
  <desc id="desc">A clean overview of clients, one Raft leader, follower read replicas, change-log watches, and the leader local LSM write path with WAL, memtable, change log, SSTables, Bloom filters, flush, and compaction.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <style>
      .page { fill: #f8fafc; }
      .header { fill: #0f172a; }
      .band { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .client { fill: #fefce8; stroke: #ca8a04; stroke-width: 2.5; }
      .leader { fill: #ecfdf5; stroke: #16a34a; stroke-width: 3; }
      .follower { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .watch { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .title { font: 700 34px Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #334155; }
      .band-title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .heading { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 17px Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 15px Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 13px Arial, sans-serif; fill: #64748b; }
      .green { stroke: #16a34a; }
      .blue { stroke: #2563eb; }
      .amber { stroke: #d97706; }
      .line { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke-width: 2.5; }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1600" height="980"/>
  <rect class="header" x="0" y="0" width="1600" height="86"/>
  <text class="title" x="800" y="55" text-anchor="middle">High-Level Architecture</text>
  <text class="subtitle" x="800" y="118" text-anchor="middle">Distributed write-heavy key/value database: one write leader, follower read replicas, replayable change log, and local LSM storage.</text>

  <!-- Cluster routing lane -->
  <rect class="band" x="60" y="150" width="1480" height="350" rx="18"/>
  <text class="band-title" x="100" y="192">Cluster Routing</text>

  <rect class="client" x="100" y="235" width="260" height="150" rx="12"/>
  <text class="heading" x="230" y="274" text-anchor="middle">Clients</text>
  <text class="label" x="230" y="312" text-anchor="middle">REST API + SQL</text>
  <text class="small" x="230" y="342" text-anchor="middle">transactions, writes, point reads</text>
  <text class="small" x="230" y="366" text-anchor="middle">and range reads</text>

  <rect class="leader" x="500" y="215" width="420" height="190" rx="14"/>
  <text class="heading" x="710" y="256" text-anchor="middle">Node A - Leader</text>
  <text class="small" x="710" y="290" text-anchor="middle">only node that accepts writes</text>
  <text class="small" x="710" y="318" text-anchor="middle">serves reads and publishes change log</text>
  <rect class="box" x="545" y="345" width="110" height="38" rx="8"/>
  <text class="tiny" x="600" y="369" text-anchor="middle">/kv</text>
  <rect class="box" x="675" y="345" width="110" height="38" rx="8"/>
  <text class="tiny" x="730" y="369" text-anchor="middle">/sql</text>
  <rect class="box" x="805" y="345" width="80" height="38" rx="8"/>
  <text class="tiny" x="845" y="369" text-anchor="middle">/tx</text>

  <rect class="follower" x="1050" y="205" width="410" height="220" rx="14"/>
  <text class="heading" x="1255" y="246" text-anchor="middle">Follower Read Replicas</text>
  <rect class="box" x="1090" y="280" width="155" height="95" rx="10"/>
  <text class="label" x="1167.5" y="313" text-anchor="middle">Node B</text>
  <text class="small" x="1167.5" y="342" text-anchor="middle">reads OK</text>
  <text class="tiny" x="1167.5" y="364" text-anchor="middle">writes return 409</text>
  <rect class="box" x="1265" y="280" width="155" height="95" rx="10"/>
  <text class="label" x="1342.5" y="313" text-anchor="middle">Node C</text>
  <text class="small" x="1342.5" y="342" text-anchor="middle">reads OK</text>
  <text class="tiny" x="1342.5" y="364" text-anchor="middle">writes return 409</text>

  <path class="line green" d="M 360 275 L 500 275" marker-end="url(#arrow-green)"/>
  <text class="small" x="430" y="255" text-anchor="middle" fill="#16a34a">writes</text>

  <path class="line blue thin" d="M 360 350 L 430 350 L 430 455 L 1050 455 L 1050 365" marker-end="url(#arrow-blue)"/>
  <text class="small" x="610" y="478" text-anchor="middle" fill="#2563eb">point and range reads can go to followers</text>

  <path class="line amber dash thin" d="M 920 270 L 1050 270" marker-end="url(#arrow-amber)"/>
  <text class="small" x="985" y="250" text-anchor="middle" fill="#d97706">Raft REST</text>
  <text class="tiny" x="985" y="295" text-anchor="middle" fill="#d97706">votes + heartbeats</text>

  <path class="line blue" d="M 920 335 L 1050 335" marker-end="url(#arrow-blue)"/>
  <text class="small" x="985" y="318" text-anchor="middle" fill="#2563eb">change-log watch</text>
  <text class="tiny" x="985" y="362" text-anchor="middle" fill="#2563eb">SSE from last sequence</text>

  <!-- Leader local write path lane -->
  <rect class="band" x="60" y="550" width="1480" height="360" rx="18"/>
  <text class="band-title" x="100" y="592">Leader Local Write Path</text>

  <rect class="box" x="100" y="650" width="175" height="90" rx="12"/>
  <text class="label" x="187.5" y="684" text-anchor="middle">API / SQL</text>
  <text class="small" x="187.5" y="714" text-anchor="middle">validate request</text>

  <rect class="box" x="315" y="650" width="175" height="90" rx="12"/>
  <text class="label" x="402.5" y="684" text-anchor="middle">Transactions</text>
  <text class="small" x="402.5" y="714" text-anchor="middle">stage until commit</text>

  <rect class="box" x="530" y="650" width="175" height="90" rx="12"/>
  <text class="label" x="617.5" y="684" text-anchor="middle">WAL</text>
  <text class="small" x="617.5" y="714" text-anchor="middle">durable first</text>

  <rect class="box" x="745" y="650" width="175" height="90" rx="12"/>
  <text class="label" x="832.5" y="684" text-anchor="middle">MemTable</text>
  <text class="small" x="832.5" y="714" text-anchor="middle">ordered memory</text>

  <rect class="box" x="960" y="650" width="175" height="90" rx="12"/>
  <text class="label" x="1047.5" y="684" text-anchor="middle">Change Log</text>
  <text class="small" x="1047.5" y="714" text-anchor="middle">committed events</text>

  <rect class="watch" x="1190" y="650" width="280" height="90" rx="12"/>
  <text class="label" x="1330" y="684" text-anchor="middle">Watchers</text>
  <text class="small" x="1330" y="714" text-anchor="middle">followers and external consumers</text>

  <path class="line green thin" d="M 275 695 L 315 695" marker-end="url(#arrow-green)"/>
  <path class="line green thin" d="M 490 695 L 530 695" marker-end="url(#arrow-green)"/>
  <path class="line green thin" d="M 705 695 L 745 695" marker-end="url(#arrow-green)"/>
  <path class="line green thin" d="M 920 695 L 960 695" marker-end="url(#arrow-green)"/>
  <path class="line blue thin" d="M 1135 695 L 1190 695" marker-end="url(#arrow-blue)"/>

  <rect class="box" x="745" y="790" width="175" height="80" rx="12"/>
  <text class="label" x="832.5" y="822" text-anchor="middle">Flush</text>
  <text class="small" x="832.5" y="850" text-anchor="middle">size threshold</text>

  <rect class="box" x="960" y="790" width="175" height="80" rx="12"/>
  <text class="label" x="1047.5" y="822" text-anchor="middle">SSTables</text>
  <text class="small" x="1047.5" y="850" text-anchor="middle">immutable sorted files</text>

  <rect class="box" x="1175" y="790" width="175" height="80" rx="12"/>
  <text class="label" x="1262.5" y="822" text-anchor="middle">Bloom Filters</text>
  <text class="small" x="1262.5" y="850" text-anchor="middle">skip absent keys</text>

  <rect class="box" x="1390" y="790" width="115" height="80" rx="12"/>
  <text class="label" x="1447.5" y="817" text-anchor="middle">Compact</text>
  <text class="tiny" x="1447.5" y="843" text-anchor="middle">merge</text>
  <text class="tiny" x="1447.5" y="862" text-anchor="middle">SSTables</text>

  <path class="line amber thin" d="M 832.5 740 L 832.5 790" marker-end="url(#arrow-amber)"/>
  <path class="line amber thin" d="M 920 830 L 960 830" marker-end="url(#arrow-amber)"/>
  <path class="line blue thin" d="M 1135 830 L 1175 830" marker-end="url(#arrow-blue)"/>
  <path class="line amber thin" d="M 1350 830 L 1390 830" marker-end="url(#arrow-amber)"/>

  <text class="tiny" x="832.5" y="768" text-anchor="middle" fill="#d97706">when memtable is full</text>
  <text class="tiny" x="1447.5" y="895" text-anchor="middle" fill="#64748b">compaction runs after every flush</text>
</svg>
