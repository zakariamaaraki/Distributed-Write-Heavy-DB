<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="820" viewBox="0 0 1250 820">
 <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.h{font-size:17px;font-weight:700}.t{font-size:13px}.box{fill:#f7f9fc;stroke:#31527d;stroke-width:2;rx:10}.store{fill:#eef6ff;stroke:#3b6ea5}.raft{fill:#e5f4ea;stroke:#2e7d4f}.wire{stroke:#526581;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:7 5}</style>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#526581"/></marker></defs>
 <text x="625" y="38" text-anchor="middle" class="title">Low-Level Table Election, Write, and Bootstrap Flow</text>
 <rect x="40" y="80" width="250" height="130" class="box"/><text x="165" y="112" text-anchor="middle" class="h">Client request</text><text x="65" y="145" class="t">PUT /tables/users/kv/k1</text><text x="65" y="172" class="t">or SQL INSERT</text>
 <rect x="350" y="80" width="270" height="130" class="box raft"/><text x="485" y="112" text-anchor="middle" class="h">Table role guard</text><text x="375" y="145" class="t">read ownership record</text><text x="375" y="172" class="t">leader accepts; follower redirects</text>
 <rect x="680" y="80" width="250" height="130" class="box raft"/><text x="805" y="112" text-anchor="middle" class="h">Table Raft group</text><text x="705" y="145" class="t">term + vote + heartbeat</text><text x="705" y="172" class="t">majority election</text>
 <rect x="990" y="80" width="220" height="130" class="box store"/><text x="1100" y="112" text-anchor="middle" class="h">Table leader</text><text x="1015" y="145" class="t">append table WAL</text><text x="1015" y="172" class="t">update memtable</text>
 <path d="M290 145 H350" class="wire"/><path d="M620 145 H680" class="wire"/><path d="M930 145 H990" class="wire"/>
 <rect x="70" y="300" width="300" height="150" class="box store"/><text x="220" y="335" text-anchor="middle" class="h">Follower bootstrap</text><text x="95" y="370" class="t">GET /tables/users/snapshot</text><text x="95" y="397" class="t">apply rows at snapshot sequence</text><text x="95" y="424" class="t">resume SSE from that sequence</text>
 <rect x="470" y="300" width="300" height="150" class="box store"/><text x="620" y="335" text-anchor="middle" class="h">Change log stream</text><text x="495" y="370" class="t">global ordered events</text><text x="495" y="397" class="t">each event names its table</text><text x="495" y="424" class="t">heartbeat keeps SSE alive</text>
 <rect x="870" y="300" width="300" height="150" class="box store"/><text x="1020" y="335" text-anchor="middle" class="h">Follower apply</text><text x="895" y="370" class="t">filter by table</text><text x="895" y="397" class="t">apply WAL/memtable change</text><text x="895" y="424" class="t">persist applied sequence</text>
 <path d="M370 375 H470" class="wire dash"/><path d="M770 375 H870" class="wire"/>
 <rect x="180" y="550" width="900" height="170" class="box"/><text x="630" y="585" text-anchor="middle" class="h">Disk layout for one table</text><text x="220" y="620" class="t">tables/users/wal.log</text><text x="520" y="620" class="t">tables/users/*.sstable</text><text x="820" y="620" class="t">tables/users/*.index.json + *.bloom.json</text><text x="220" y="660" class="t">__table_ownership stores leaderId, term, members, and rebalanceId</text><text x="220" y="690" class="t">Cross-table distributed transactions are rejected</text>
</svg>
