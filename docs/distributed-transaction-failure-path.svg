<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430"><style>text{font-family:Arial;fill:#172033}.b{fill:#eef4ff;stroke:#356ae6;stroke-width:2}.p{fill:#effaf3;stroke:#2f9e63;stroke-width:2}.f{fill:#fff1f0;stroke:#d64545;stroke-width:2}.a{stroke:#40526d;stroke-width:2;marker-end:url(#m)}.h{font-size:18px;font-weight:bold}.s{font-size:15px}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z"/></marker></defs><text x="30" y="32" class="h">2PC failure and recovery path</text><rect x="35" y="150" width="180" height="80" rx="10" class="b"/><text x="75" y="185" class="h">Coordinator</text><text x="62" y="210" class="s">journal: committing</text><rect x="420" y="80" width="250" height="80" rx="10" class="p"/><text x="490" y="115" class="h">Participant A</text><text x="458" y="140" class="s">committed and durable</text><rect x="420" y="250" width="250" height="80" rx="10" class="f"/><text x="490" y="285" class="h">Participant B</text><text x="450" y="310" class="s">timeout / prepared</text><rect x="790" y="165" width="250" height="80" rx="10" class="b"/><text x="830" y="200" class="h">Recovery service</text><text x="815" y="225" class="s">replay commit or abort</text><path d="M215 175L420 120M215 205L420 290M670 290L790 215" class="a"/><text x="250" y="115" class="s">phase 2</text><text x="250" y="280" class="s">lost response</text><text x="700" y="350" class="s">status = in-doubt until decision is resolved</text></svg>
