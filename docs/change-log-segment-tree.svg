<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">Segmented change log tree</title>
  <desc id="desc">Committed changes flow into bounded numbered append-only log segments. Replay walks legacy and numbered files in sequence order, while live subscribers receive flushed events.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker>
    <style>
      .page{fill:#f8fafc}.header{fill:#0f172a}.band{fill:#fff;stroke:#cbd5e1;stroke-width:2}.write{fill:#eef2ff;stroke:#6366f1;stroke-width:2.5}.seg{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5}.active{fill:#ecfdf5;stroke:#16a34a;stroke-width:3}.read{fill:#fff7ed;stroke:#d97706;stroke-width:2.5}.muted{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.title{font:700 34px Arial,sans-serif;fill:#fff}.subtitle{font:500 16px Arial,sans-serif;fill:#334155}.band-title{font:700 23px Arial,sans-serif;fill:#0f172a}.heading{font:700 19px Arial,sans-serif;fill:#0f172a}.label{font:600 15px Arial,sans-serif;fill:#1f2937}.small{font:500 13px Arial,sans-serif;fill:#475569}.mono{font:600 13px Consolas,monospace;fill:#1f2937}.tiny{font:500 12px Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect class="page" width="1500" height="940"/><rect class="header" width="1500" height="88"/>
  <text class="title" x="750" y="54" text-anchor="middle">Bounded, Append-Only Change Log Segments</text>
  <text class="subtitle" x="750" y="120" text-anchor="middle">One global sequence is preserved while the physical log is split into manageable files.</text>

  <rect class="band" x="55" y="150" width="1390" height="235" rx="18"/><text class="band-title" x="90" y="190">Committed write path</text>
  <rect class="write" x="95" y="225" width="270" height="105" rx="14"/><text class="heading" x="230" y="260" text-anchor="middle">Committed operation</text><text class="small" x="230" y="286" text-anchor="middle">global sequence 121</text><text class="small" x="230" y="309" text-anchor="middle">table + key + value</text>
  <path class="line" stroke="#6366f1" d="M365 277L450 277" marker-end="url(#arrow-blue)"/><text class="tiny" x="407" y="258" text-anchor="middle">serialize</text>
  <rect class="seg" x="450" y="215" width="360" height="125" rx="14"/><text class="heading" x="630" y="250" text-anchor="middle">Active segment</text><text class="mono" x="630" y="278" text-anchor="middle">changelog-...0003.log</text><text class="small" x="630" y="305" text-anchor="middle">append JSONL + flush</text>
  <path class="line" stroke="#16a34a" d="M810 277L900 277" marker-end="url(#arrow-green)"/><text class="tiny" x="855" y="258" text-anchor="middle">full?</text>
  <rect class="active" x="900" y="215" width="470" height="125" rx="14"/><text class="heading" x="1135" y="250" text-anchor="middle">Rotate before next event</text><text class="small" x="1135" y="278" text-anchor="middle">create ...0004.log when size limit is reached</text><text class="small" x="1135" y="305" text-anchor="middle">one event is never split across files</text>

  <rect class="band" x="55" y="425" width="1390" height="235" rx="18"/><text class="band-title" x="90" y="465">On-disk tree</text>
  <rect class="muted" x="105" y="505" width="260" height="105" rx="12"/><text class="heading" x="235" y="540" text-anchor="middle">data/</text><text class="mono" x="235" y="570" text-anchor="middle">changelog.log</text><text class="tiny" x="235" y="592" text-anchor="middle">legacy-compatible first file</text>
  <path class="line" stroke="#64748b" d="M365 557L455 557" marker-end="url(#arrow-amber)"/>
  <rect class="seg" x="455" y="490" width="270" height="135" rx="12"/><text class="mono" x="590" y="530" text-anchor="middle">...0001.log</text><text class="mono" x="590" y="558" text-anchor="middle">...0002.log</text><text class="tiny" x="590" y="592" text-anchor="middle">immutable older segments</text>
  <path class="line" stroke="#2563eb" d="M725 557L815 557" marker-end="url(#arrow-blue)"/>
  <rect class="active" x="815" y="490" width="300" height="135" rx="12"/><text class="mono" x="965" y="530" text-anchor="middle">...0003.log</text><text class="small" x="965" y="560" text-anchor="middle">current append target</text><text class="tiny" x="965" y="592" text-anchor="middle">max 64 MiB by default</text>
  <path class="line" stroke="#16a34a" d="M1115 557L1205 557" marker-end="url(#arrow-green)"/>
  <rect class="read" x="1205" y="490" width="190" height="135" rx="12"/><text class="heading" x="1300" y="530" text-anchor="middle">ordered replay</text><text class="small" x="1300" y="560" text-anchor="middle">sequence filter</text><text class="small" x="1300" y="585" text-anchor="middle">SSE catch-up</text>

  <rect class="band" x="55" y="700" width="1390" height="180" rx="18"/><text class="band-title" x="90" y="740">Read paths</text>
  <rect class="read" x="105" y="770" width="350" height="75" rx="12"/><text class="heading" x="280" y="802" text-anchor="middle">GET /changes?fromSequence=N</text><text class="small" x="280" y="826" text-anchor="middle">walk files in numeric order</text>
  <path class="line" stroke="#d97706" d="M455 807L570 807" marker-end="url(#arrow-amber)"/>
  <rect class="read" x="570" y="770" width="350" height="75" rx="12"/><text class="heading" x="745" y="802" text-anchor="middle">SSE stream</text><text class="small" x="745" y="826" text-anchor="middle">replay, then live channel</text>
  <path class="line" stroke="#16a34a" d="M920 807L1035 807" marker-end="url(#arrow-green)"/>
  <rect class="active" x="1035" y="770" width="360" height="75" rx="12"/><text class="heading" x="1215" y="802" text-anchor="middle">follower catch-up</text><text class="small" x="1215" y="826" text-anchor="middle">resume from last applied sequence</text>
</svg>
