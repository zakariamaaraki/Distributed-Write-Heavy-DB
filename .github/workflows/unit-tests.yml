name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/LsmWriteDb.Tests/LsmWriteDb.Tests.csproj

      - name: Build
        run: dotnet build LsmWriteDb.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/LsmWriteDb.Tests/LsmWriteDb.Tests.csproj --configuration Release --no-restore
